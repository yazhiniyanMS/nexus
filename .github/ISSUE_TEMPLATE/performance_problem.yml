name: Performance problem
description: NEXUS is slow, uses too much memory or CPU
title: "[Performance] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the NEXUS public beta. Please do not paste source code, API keys or terminal output you would not post in public.
  - type: dropdown
    id: area
    attributes:
      label: Where is it slow?
      options: [Startup, Importing or analysing a project, Code index, Search, Terminal, Git, Model Lab, Agents, Everywhere]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you measure or notice?
      description: Rough numbers help - project size (files), how long it took, memory shown by your system monitor.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXUS version
      description: Shown under "About & feedback" in the sidebar.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Linux (Ubuntu/Debian), Linux (Fedora/RHEL), Linux (other)]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: In NEXUS open "About & feedback", read the report, then paste it here. It contains versions and counts only; edit out anything you do not want to share.
      render: text
