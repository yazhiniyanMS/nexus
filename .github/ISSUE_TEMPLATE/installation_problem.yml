name: Installation problem
description: NEXUS will not install, start or update
title: "[Install] "
labels: ["installation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the NEXUS public beta. Please do not paste source code, API keys or terminal output you would not post in public.
  - type: dropdown
    id: package
    attributes:
      label: Which download did you use?
      options: [.dmg (macOS), -setup.exe (Windows), .msi (Windows), .AppImage (Linux), .deb (Linux), .rpm (Linux), Built from source]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact text of any warning or error dialog, and whether this was a first install or an update.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXUS version
      description: Shown under "About & feedback" in the sidebar.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Linux (Ubuntu/Debian), Linux (Fedora/RHEL), Linux (other)]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: In NEXUS open "About & feedback", read the report, then paste it here. It contains versions and counts only; edit out anything you do not want to share.
      render: text
