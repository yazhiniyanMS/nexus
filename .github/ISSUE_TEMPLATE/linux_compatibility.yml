name: Linux compatibility
description: Something behaves wrongly only on Linux
title: "[Linux] "
labels: ["linux"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the NEXUS public beta. Please do not paste source code, API keys or terminal output you would not post in public.
  - type: input
    id: distro
    attributes:
      label: Distribution, desktop and display server
      placeholder: "Ubuntu 24.04, GNOME, Wayland"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Package install (.deb / .rpm / AppImage), Missing system library, Terminal, Git, File dialogs, API key storage (Secret Service), Model Lab, Appearance, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: If NEXUS does not start, run it from a terminal and paste what it prints.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXUS version
      description: Shown under "About & feedback" in the sidebar.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Linux (Ubuntu/Debian), Linux (Fedora/RHEL), Linux (other)]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: In NEXUS open "About & feedback", read the report, then paste it here. It contains versions and counts only; edit out anything you do not want to share.
      render: text
